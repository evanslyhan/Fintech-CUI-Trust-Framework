# U.S. Regulatory Mapping: Truth in Lending Act (TILA) / Regulation Z (12 CFR Part 1026)
# Illustrative configuration overlay on core Sections 3–6. Not legal advice or regulatory certification.

product_line: lending
jurisdiction_id: us_federal_reg_z
spec_version: "0.4"
confidence_floor: 0.80

scoped_credential:
  enabled: true
  single_use: true
  ttl_minutes: 10
  max_amount: 0            # Consummation of credit requires institutional workflow post-disclosure
  currency: USD
  merchant_or_rail_scope: "disclosed_credit_offer_only"

action_overrides:
  inform: inherit          # General educational questions may be FREE at F0/R0; specific rate quotes checked by Generation Boundary
  advise: raise_to_auth
  commit: raise_to_escalate   # Credit consummation / offer acceptance cannot bypass disclosure verification
  transact: raise_to_escalate
  represent: raise_to_escalate

breaker_overrides:
  cumulative_trigger_limit: 2
  vulnerability_detection: enabled
  trajectory_window: 4

boundary_additions:
  - "Stating APR, finance charge, or repayment schedule without accompanying required Reg Z disclosure fields"
  - "Treating general credit rate inquiries as binding consummation or guaranteed approval"
  - "Proceeding with any request that would waive or shorten statutory rescission rights"

retention_period_days: 2555
audit_export_format: jsonl
notification_requirements:
  - "disclosure_delivery_sequence_logged"
  - "affirmative_post_disclosure_consent_recorded"

notes: >
  Implements Reg Z (TILA) mapping on invariant v0.4 Core: distinguishes general
  credit education (inform) from initiating/modifying credit obligations (commit/transact);
  requires disclosure sequence reconstruction in Audit Trail Pipeline; fires
  Authority Circuit Breaker on requests to waive or shorten statutory rescission periods.
